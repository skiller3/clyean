# Reusable build pipeline shared by ci.yml (every commit on every branch) and
# release.yml (tagged releases). It runs the unit and integration tests first
# and, only when they pass, builds the clyean CLI for every supported host
# platform plus the contained harness and the static bridge for the Linux
# sandbox architectures.
# When upload_release_tag is set, the built assets are attached to the GitHub
# release for that tag together with a SHA256SUMS manifest.
name: Build

on:
  workflow_call:
    inputs:
      upload_release_tag:
        description: Release tag whose GitHub release receives the built assets (empty for no publish)
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  HARNESS_DIR: vendor/omp

jobs:
  test-rust:
    # Ubuntu 24.04 carries Podman 4.9.3, the oldest release Clyean supports on
    # Linux, and Ubuntu 26.04 carries Podman 5.7.0. The Podman tests run on the
    # Ubuntu images, a second time through Podman's remote client, which takes
    # the paths a Podman machine takes on macOS and Windows. macOS and Windows
    # run the unit tests.
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            musl: x86_64-unknown-linux-musl
          - os: ubuntu-26.04
            musl: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            musl: aarch64-unknown-linux-musl
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.musl }}
      - uses: Swatinem/rust-cache@v2
      - name: Ensure Podman is available for sandbox integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build the static bridge for the Podman tests
        if: runner.os == 'Linux'
        run: cargo build --release --locked --target ${{ matrix.musl }} -p clyean-bridge
      - name: Unit and integration tests
        if: runner.os == 'Linux'
        env:
          CLYEAN_PODMAN_TESTS: "1"
        run: |
          export CLYEAN_BRIDGE_BINARY="$PWD/target/${{ matrix.musl }}/release/clyean-bridge"
          cargo test --workspace --locked
      - name: Podman tests through the remote client
        if: runner.os == 'Linux'
        env:
          CLYEAN_PODMAN_TESTS: "1"
        run: |
          set -euo pipefail
          socket="$RUNNER_TEMP/podman.sock"
          podman system service --time 0 "unix://$socket" &
          for _ in $(seq 1 50); do [ -S "$socket" ] && break; sleep 0.2; done
          mkdir -p "$RUNNER_TEMP/remote-bin"
          printf '#!/bin/sh\nexec %s --remote --url unix://%s "$@"\n' "$(command -v podman)" "$socket" > "$RUNNER_TEMP/remote-bin/podman"
          chmod +x "$RUNNER_TEMP/remote-bin/podman"
          export PATH="$RUNNER_TEMP/remote-bin:$PATH"
          podman info --format 'remote service: {{.Host.ServiceIsRemote}}'
          export CLYEAN_BRIDGE_BINARY="$PWD/target/${{ matrix.musl }}/release/clyean-bridge"
          cargo test --locked -p clyean-sandbox --test podman_user_assistant
      - name: Unit tests
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

  test-installers:
    # The installers size a new Podman machine from the host; their dry runs
    # print the commands, which these checks compare for a small and a large host.
    name: Installer dry runs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: macOS machine sizing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          small="$(CLYEAN_INSTALL_HOST_CPUS=2 CLYEAN_INSTALL_HOST_MEMORY_MIB=8192 sh install.sh --dry-run)"
          echo "$small"
          echo "$small" | grep -F -- "+ podman machine init --cpus 2 --memory 4096 --disk-size 100"
          large="$(CLYEAN_INSTALL_HOST_CPUS=12 CLYEAN_INSTALL_HOST_MEMORY_MIB=65536 sh install.sh --dry-run)"
          echo "$large"
          echo "$large" | grep -F -- "+ podman machine init --cpus 4 --memory 8192 --disk-size 100"
      - name: Windows machine sizing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLYEAN_INSTALL_HOST_CPUS = "2"
          $env:CLYEAN_INSTALL_HOST_MEMORY_MIB = "8192"
          $small = & ./install.ps1 -DryRun *>&1 | Out-String
          Write-Host $small
          if ($small -notmatch "\+ podman machine init" -or $small -notmatch "wslconfig") { throw "a small host must get a machine and .wslconfig advice" }
          $env:CLYEAN_INSTALL_HOST_CPUS = "16"
          $env:CLYEAN_INSTALL_HOST_MEMORY_MIB = "32768"
          $large = & ./install.ps1 -DryRun *>&1 | Out-String
          Write-Host $large
          if ($large -match "wslconfig") { throw "a large host needs no .wslconfig advice" }
          $env:CONTAINERS_MACHINE_PROVIDER = "hyperv"
          $hyperv = & ./install.ps1 -DryRun *>&1 | Out-String
          Write-Host $hyperv
          if ($hyperv -notmatch "podman machine init --cpus 4 --memory 8192 --disk-size 100") { throw "Hyper-V machines are sized like macOS machines" }

  test-extensions:
    name: Harness extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run extension tests
        run: bun test extensions

  test-harness:
    name: Contained harness smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/omp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install harness dependencies
        run: bun install --frozen-lockfile
      # The harness's native addons are Rust N-API modules that upstream builds
      # with bazel. Like upstream's own pull request path, fetch the prebuilt
      # addons for the vendored version from the npm leaf package and stage
      # them where the workspace loader looks first
      # (packages/natives/native, see packages/natives/native/loader-state.js).
      - name: Stage prebuilt native addons (linux-x64)
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/coding-agent/package.json').version")"
          tarball="$(npm view "@oh-my-pi/pi-natives-linux-x64@${version}" dist.tarball)"
          echo "Fetching ${tarball}"
          mkdir -p "$RUNNER_TEMP/natives-linux-x64"
          curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP/natives-linux-x64"
          cp "$RUNNER_TEMP/natives-linux-x64/package/"pi_natives.linux-x64-*.node packages/natives/native/
          ls -la packages/natives/native/*.node
      - name: Harness starts
        run: bun packages/coding-agent/src/cli.ts --version
      - name: Welcome screen tests
        run: bun test packages/tui/test/welcome.test.ts

  build-cli:
    name: Build clyean (${{ matrix.asset }})
    needs: [test-rust, test-installers, test-extensions, test-harness]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: clyean-linux-x64
            exe: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: clyean-linux-arm64
            exe: ""
          # Intel macOS is cross-compiled on the Apple Silicon runner because
          # GitHub has retired its Intel macOS runner images.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: clyean-darwin-x64
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: clyean-darwin-arm64
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: clyean-windows-x64.exe
            exe: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: clyean-windows-arm64.exe
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p clyean
      - name: Rename binary to release asset name
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/clyean${{ matrix.exe }}" "dist/${{ matrix.asset }}"
      # The cross-compiled Intel macOS binary needs Rosetta to run on the
      # Apple Silicon runner, so it is the one asset that is not smoke-tested.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./dist/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-bridge:
    # The bridge runs inside sandbox images of any C library, so it is a static
    # musl executable with no dependencies beyond the standard library.
    name: Build bridge (${{ matrix.asset }})
    needs: [test-rust, test-installers, test-extensions, test-harness]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: clyean-bridge-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: clyean-bridge-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p clyean-bridge
      - name: Rename binary to release asset name
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/clyean-bridge" "dist/${{ matrix.asset }}"
      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.asset }} --version
          if ldd "dist/${{ matrix.asset }}" 2>/dev/null | grep -q '=>'; then
            echo "the bridge must be statically linked" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-harness:
    name: Build contained harness (linux-x64, linux-arm64)
    needs: [test-rust, test-installers, test-extensions, test-harness]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/omp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install harness dependencies
        run: bun install --frozen-lockfile
      # gen:native (packages/natives/scripts/embed-native.ts) embeds the addons
      # found in packages/natives/native into the standalone binary and checks
      # that they carry the version sentinel of the vendored natives package, so
      # the leaf packages must match the vendored harness version exactly.
      - name: Stage prebuilt native addons for both Linux architectures
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/coding-agent/package.json').version")"
          for tag in linux-x64 linux-arm64; do
            tarball="$(npm view "@oh-my-pi/pi-natives-${tag}@${version}" dist.tarball)"
            echo "Fetching ${tarball}"
            mkdir -p "$RUNNER_TEMP/natives-${tag}"
            curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP/natives-${tag}"
            cp "$RUNNER_TEMP/natives-${tag}/package/"pi_natives.${tag}*.node packages/natives/native/
          done
          ls -la packages/natives/native/*.node
      - name: Build harness binaries
        env:
          RELEASE_TARGETS: linux-x64,linux-arm64
        run: bun run ci:release:build-binaries
      - name: Rename binaries to release asset names
        shell: bash
        run: |
          mkdir -p dist
          cp packages/coding-agent/binaries/omp-linux-x64 dist/clyean-harness-linux-x64
          cp packages/coding-agent/binaries/omp-linux-arm64 dist/clyean-harness-linux-arm64
          chmod +x dist/clyean-harness-*
      - name: Smoke test (linux-x64)
        shell: bash
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./dist/clyean-harness-linux-x64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: clyean-harness
          path: vendor/omp/dist/clyean-harness-*
          if-no-files-found: error

  publish:
    name: Publish release assets
    if: inputs.upload_release_tag != ''
    needs: [build-cli, build-bridge, build-harness]
    # Permissions are inherited from the caller: release.yml grants
    # contents: write, while ci.yml (where this job is skipped) grants read.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        shell: bash
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.upload_release_tag }}
          name: ${{ inputs.upload_release_tag }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.upload_release_tag, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
